name: Native compaction contract build
on:
  push:
    branches: [build-opencode-compaction-contract-20260928]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'ContextualWisdomLab/opencode'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/opencode
    env:
      OPENCODE_CHANNEL: cwl-compaction-contract
      OPENCODE_VERSION: 1.16.0-cwl.compaction.26ec0ace2
      MODELS_DEV_API_JSON: test/tool/fixtures/models-api.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 26ec0ace21167f5edc63a7d04c453b22b24864ae
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install frozen native dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Verify native regression and existing contracts
        run: |
          bun test test/session/prompt.test.ts --test-name-pattern 'auto compaction preserves native structured output registration' --timeout 30000
          bun test test/session/compaction.test.ts test/session/structured-output.test.ts --timeout 30000
          bun typecheck
      - name: Build native binary
        run: |
          test "$(git rev-parse HEAD)" = 26ec0ace21167f5edc63a7d04c453b22b24864ae
          test -z "${OPENCODE_RELEASE:-}"
          test -z "${GH_REPO:-}"
          bun ./script/build.ts --single --skip-install --skip-embed-web-ui
          test "$(./dist/opencode-linux-x64/bin/opencode --version)" = "$OPENCODE_VERSION"
      - name: Bind binary to reviewed source
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('../..')
          binary = pathlib.Path('dist/opencode-linux-x64/bin/opencode')
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          proof = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'official_base': '6cb74317a6efacd656483cb0489d8e7e3701c12e', 'version': os.environ['OPENCODE_VERSION'], 'bun': subprocess.check_output(['bun', '--version'], text=True).strip(), 'lock_sha256': digest(root / 'bun.lock'), 'models_sha256': digest(pathlib.Path(os.environ['MODELS_DEV_API_JSON'])), 'source_sha256': digest(pathlib.Path('src/session/compaction.ts')), 'binary_sha256': digest(binary), 'workflow_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          assert proof['source_commit'] == '26ec0ace21167f5edc63a7d04c453b22b24864ae' and proof['bun'] == '1.3.14'
          binary.with_name('provenance.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencode-cwl-compaction-26ec0ace2-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/opencode/dist/opencode-linux-x64/bin/
          if-no-files-found: error
          retention-days: 7
